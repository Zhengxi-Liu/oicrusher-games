<!DOCTYPE html>
<html lang="zh">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍉 趣味消消乐</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f8ff; /* 淡蓝色背景 */
            margin: 0;
            min-height: 100vh;
            padding-top: 40px;
        }

        .container {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ff6b6b; /* 鲜艳的标题颜色 */
            margin-bottom: 20px;
        }

        .stack-container {
            position: relative;
            width: 100%;
            min-height: 400px; /* 根据关卡调整 */
            margin-bottom: 20px;
            perspective: 800px; /* 开启 3D 透视 */
        }

        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            cursor: pointer;
            user-select: none;
            font-size: 22px;
            text-align: center;
            position: absolute;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out, background-color 0.2s ease-out, opacity 0.2s ease-out;
            transform-style: preserve-3d; /* 使子元素保持 3D 变换 */
        }

        .card:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 3px 3px 7px rgba(0, 0, 0, 0.08);
        }

        .card.selected {
            background-color: #aed6f1;
            border-color: #3498db;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 4px 4px 9px rgba(0, 0, 0, 0.1);
        }

        .card.inactive {
            background-color: #f9f9f9; /* 淡化未激活卡牌 */
            opacity: 0.6;
            cursor: default;
        }

        .collection-area {
            background-color: #f0f0f0;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            min-height: 60px;
            width: 100%;
            overflow-x: auto;
        }

        .collected-card {
            background-color: #e0e0e0;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 18px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.05);
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #2ecc71;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s ease-in-out;
        }

        .controls button:hover {
            background-color: #27ae60;
        }

        .message {
            text-align: center;
            font-size: 20px;
            margin-top: 30px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍉 趣味消消乐</h1>
        <div class="stack-container" id="stackContainer">
            </div>
        <div class="collection-area" id="collectionArea">
            </div>
        <div class="controls">
            <button id="resetButton">重新开始</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        const stackContainer = document.getElementById('stackContainer');
        const collectionArea = document.getElementById('collectionArea');
        const resetButton = document.getElementById('resetButton');
        const messageElement = document.getElementById('message');

        let gameStack = [];
        let collectedCards = [];
        const maxCollection = 7;

        const emojiCategories = {
            fruits: ['🍎', '🍊', '🍋', '🍇', '🍓', '🍉', '🥝', '🍍'],
            vehicles: ['🚗', '🚕', '🚌', '🚂', '✈️', '🚀', '🚢', '🚲'],
            food: ['🍔', '🍕', '🍟', '🌭', '🍣', '🍦', '🍩', '🍰'],
            animals: ['🐶', '🐱', '🐰', '🐻', '🐼', '🦊', '🦁', '🐯'],
            nature: ['🌳', '🌻', '🍄', '🌎', '☀️', '🌙', '⭐', '🌈'],
            objects: ['💡', '📱', '💻', '🎁', '📚', '⏰', '🔑', '💰']
        };

        let allEmoji = [];
        for (const category in emojiCategories) {
            allEmoji = allEmoji.concat(emojiCategories[category]);
        }

        function generateLevelLayout() {
            const layout = [];
            const numPairs = 30; // 每种 Emoji 的对数（总共需要 3 * numPairs 个卡片才能消除）
            const availableEmoji = [...allEmoji];

            for (let i = 0; i < numPairs; i++) {
                if (availableEmoji.length < 1) break;
                const randomIndex = Math.floor(Math.random() * availableEmoji.length);
                const emoji = availableEmoji.splice(randomIndex, 1)[0];
                for (let j = 0; j < 3; j++) {
                    layout.push({ type: emoji });
                }
            }

            // 随机排列
            layout.sort(() => Math.random() - 0.5);

            const positionedLayout = [];
            let cardIndex = 0;
            const numRows = 8;
            const cardsPerRow = 8;
            const zOffset = 5;

            for (let i = 0; i < numRows; i++) {
                for (let j = 0; j < cardsPerRow; j++) {
                    if (cardIndex < layout.length) {
                        positionedLayout.push({
                            ...layout[cardIndex],
                            layer: i,
                            x: 40 + j * 60 + (i % 2) * 30 + Math.random() * 10 - 5, // 错落的 X 轴
                            y: 60 + i * 40 + Math.random() * 10 - 5,     // 错落的 Y 轴
                            z: -i * zOffset + Math.random() * 4 - 2      // Z 轴偏移
                        });
                        cardIndex++;
                    }
                }
            }

            // 添加一些更深层的覆盖
            for (let i = 0; i < 15 && cardIndex < layout.length; i++) {
                positionedLayout.push({
                    ...layout[cardIndex],
                    layer: numRows + Math.floor(i / 5) + 1,
                    x: 100 + (i % 5) * 80 + Math.random() * 20 - 10,
                    y: 100 + numRows * 40 + Math.floor(i / 5) * 40 + Math.random() * 20 - 10,
                    z: -(numRows + Math.floor(i / 5) + 1) * zOffset + Math.random() * 6 - 3
                });
                cardIndex++;
            }

            return positionedLayout;
        }

        function initializeGame() {
            const generatedLayout = generateLevelLayout();
            gameStack = generatedLayout.map((card, index) => ({ ...card, id: index, selected: false, active: false }));
            renderGameStack();
            collectedCards = [];
            updateCollectionArea();
            messageElement.textContent = '';
            updateCardActivation(); // 初始激活状态
        }

        function renderGameStack() {
            stackContainer.innerHTML = '';
            gameStack.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.classList.add('card');
                cardElement.textContent = card.type;
                cardElement.dataset.id = card.id;
                cardElement.style.top = `${card.y}px`;
                cardElement.style.left = `${card.x}px`;
                cardElement.style.transform = `translateZ(${card.z}px)`;
                cardElement.style.zIndex = card.layer;
                if (!card.active) {
                    cardElement.classList.add('inactive');
                } else {
                    cardElement.classList.remove('inactive');
                }
                cardElement.addEventListener('click', () => handleCardClick(card));
                stackContainer.appendChild(cardElement);
            });
        }

        function handleCardClick(clickedCard) {
            if (!clickedCard.active) {
                return;
            }

            if (collectedCards.length >= maxCollection) {
                messageElement.textContent = '收集区已满！';
                return;
            }

            const cardInStack = gameStack.find(card => card.id === clickedCard.id);
            if (cardInStack && !cardInStack.selected) {
                cardInStack.selected = true;
                collectedCards.push(cardInStack);
                updateCollectionArea();
                removeSelectedCards();
                updateCardActivation();
            }
        }

        function updateCardActivation() {
            gameStack.forEach(card => {
                if (!card.selected) {
                    const coveringCards = gameStack.filter(
                        otherCard => otherCard.active &&
                                     !otherCard.selected &&
                                     otherCard.layer > card.layer &&
                                     isOverlapping(card, otherCard)
                    );
                    card.active = coveringCards.length === 0;
                }
            });
            renderGameStack();
        }

        function isOverlapping(cardA, cardB) {
            const rectA = {
                left: cardA.x,
                top: cardA.y,
                right: cardA.x + 50, // 假设卡片宽度
                bottom: cardA.y + 40  // 假设卡片高度
            };
            const rectB = {
                left: cardB.x,
                top: cardB.y,
                right: cardB.x + 50,
                bottom: cardB.y + 40
            };

            return !(rectA.right < rectB.left ||
                     rectA.left > rectB.right ||
                     rectA.bottom < rectB.top ||
                     rectA.top > rectB.bottom);
        }

        function updateCollectionArea() {
            collectionArea.innerHTML = '';
            const typeCounts = {};
            collectedCards.forEach(card => {
                const collectedCardElement = document.createElement('div');
                collectedCardElement.classList.add('collected-card');
                collectedCardElement.textContent = card.type;
                collectionArea.appendChild(collectedCardElement);
                typeCounts[card.type] = (typeCounts[card.type] || 0) + 1;
            });

            if (collectedCards.length >= maxCollection) {
                messageElement.textContent = '挑战失败！再试一次？';
            }
        }

        function removeSelectedCards() {
            const typeCounts = {};
            collectedCards.forEach(card => {
                typeCounts[card.type] = (typeCounts[card.type] || 0) + 1;
            });

            for (const type in typeCounts) {
                if (typeCounts[type] >= 3) {
                    const removedCards = collectedCards.filter(card => card.type === type);
                    removedCards.forEach(removedCard => {
                        const indexInGameStack = gameStack.findIndex(card => card.id === removedCard.id);
                        if (indexInGameStack !== -1) {
                            gameStack.splice(indexInGameStack, 1);
                        }
                        const collectedIndex = collectedCards.findIndex(card => card.id === removedCard.id);
                        if (collectedIndex !== -1) {
                            collectedCards.splice(collectedIndex, 1);
                        }
                        const cardElement = document.querySelector(`.card[data-id="${removedCard.id}"]`);
                        if (cardElement) {
                            cardElement.remove();
                        }
                    });
                    updateCollectionArea();
                    removeSelectedCards(); // 递归检查新的三消
                    return;
                }
            }

            gameStack.forEach(card => card.selected = false); // 清除选中状态
            renderGameStack(); // 重新渲染以更新 inactive 状态
            checkWinCondition();
        }

        function checkWinCondition() {
            if (gameStack.length === 0 && collectedCards.length === 0) {
                messageElement.textContent = '🎉 恭喜通关！太厉害了！🎉';
            } else if (gameStack.length > 0 && collectedCards.length >= maxCollection) {
                // 失败消息已经在 updateCollectionArea 中显示
            }
        }

        function resetGame() {
            initializeGame();
        }

        resetButton.addEventListener('click', resetGame);

        // 游戏初始化
        initializeGame();
    </script>
</body>
</html>
