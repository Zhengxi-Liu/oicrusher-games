    bar.innerHTML = '';
    for (const t of TOOLS) {
      const b = document.createElement('button');
      b.className = 'tool'; b.dataset.tool = t.id;
      const d = t.build ? BUILDINGS[t.build] : null;
      b.title = (d ? d.name + ' — ' + d.desc + '\nCost: ' + fmtCost(d.cost) : t.desc) + '  [' + t.key + ']';
      b.innerHTML = `<span class="k">${t.key}</span><span class="ic">${t.icon}</span><span class="lb">${t.label}</span>`;
      b.addEventListener('click', () => this.setTool(this.tool === t ? null : t));
      bar.appendChild(b);
    }
    this.setTool(null);
  }
  setTool(t) {
    this.tool = t; this.drag = null;
    for (const el of document.querySelectorAll('.tool')) el.classList.toggle('on', !!t && el.dataset.tool === t.id);
    const info = this.$('toolInfo');
    if (!t) info.innerHTML = 'Select a tool (keys 1-0, M, X, C). Click a Duplicant to inspect. Right-click cancels orders.';
    else if (t.build) {
      const d = BUILDINGS[t.build];
      info.innerHTML = `<b>${d.name}</b> · ${fmtCost(d.cost)} · ${d.desc} ${t.mode === 'place' ? '' : '(drag)'}`;
    } else info.innerHTML = `<b>${t.label}</b> · ${t.desc}`;
  }

  // ------------------------------------------------------------ input
  cellFromEvent(e) {
    const r = this.canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * COLS);
    const y = Math.floor((e.clientY - r.top) / r.height * ROWS);
    return { x: clamp(x, 0, COLS - 1), y: clamp(y, 0, ROWS - 1) };
  }
  dragRect() {
    const d = this.drag;
    return { x0: Math.min(d.x0, d.x1), y0: Math.min(d.y0, d.y1), x1: Math.max(d.x0, d.x1), y1: Math.max(d.y0, d.y1) };
  }
  /** Cells affected by the current rect / line drag (or the hover cell). */
  dragCells() {
    const out = [];
    if (!this.tool) return out;
    if (!this.drag) { if (this.hover) out.push([this.hover.x, this.hover.y]); return out; }
    const d = this.drag;
    if (this.tool.mode === 'line') {   // L-shaped: horizontal first, then vertical
      const sx = Math.sign(d.x1 - d.x0) || 1, sy = Math.sign(d.y1 - d.y0) || 1;
      for (let x = d.x0; x !== d.x1 + sx; x += sx) out.push([x, d.y0]);
      for (let y = d.y0 + sy; y !== d.y1 + sy; y += sy) out.push([d.x1, y]);
      if (d.y0 === d.y1) { /* already covered */ }
      return out;
    }
    const r = this.dragRect();
    for (let y = r.y0; y <= r.y1; y++) for (let x = r.x0; x <= r.x1; x++) out.push([x, y]);
    return out;
  }
  bindInput() {
    const cv = this.canvas, g = this.game;
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      const c = this.cellFromEvent(e);
      this.hover = c;
      if (e.button === 2) {   // right click: drop tool or cancel orders here
        if (this.tool) this.setTool(null); else g.cancelAt([[c.x, c.y]]);
        return;
      }
      if (e.button !== 0) return;
      cv.setPointerCapture(e.pointerId);
      if (!this.tool) { g.selectAt(c.x, c.y); return; }
      if (this.tool.mode === 'place') {
        const d = BUILDINGS[this.tool.build];
        g.orderBuild(this.tool.build, [[c.x, c.y - d.h + 1]]);
        return;
      }
      this.drag = { x0: c.x, y0: c.y, x1: c.x, y1: c.y };
    });
    cv.addEventListener('pointermove', e => {
      const c = this.cellFromEvent(e);
      this.hover = c;
      if (this.drag) { this.drag.x1 = c.x; this.drag.y1 = c.y; }
      this.updateHover();
    });
    cv.addEventListener('pointerleave', () => { if (!this.drag) { this.hover = null; this.updateHover(); } });
    const finish = () => {
      if (!this.drag || !this.tool) { this.drag = null; return; }
      const cells = this.dragCells(), t = this.tool;
      this.drag = null;
      if (t.id === 'dig') g.orderDig(cells);
      else if (t.id === 'decon') g.orderDecon(cells);
      else if (t.id === 'cancel') g.cancelAt(cells);
      else if (t.build) g.orderBuild(t.build, cells);
    };
    cv.addEventListener('pointerup', finish);
    cv.addEventListener('pointercancel', () => { this.drag = null; });

    window.addEventListener('keydown', e => {
      if (e.target && e.target.tagName === 'INPUT') return;
      const k = e.key.toUpperCase();
      if (k === ' ') { e.preventDefault(); g.setSpeed(g.speed === 0 ? (g.lastSpeed || 1) : 0); return; }
      if (k === 'ESCAPE') { this.setTool(null); g.selected = null; this.hideModal(); return; }
      if (k === 'O') return this.setOverlay('oxygen');
      if (k === 'T') return this.setOverlay('temperature');
      if (k === 'P') return this.setOverlay('power');
      if (k === 'V') return this.setOverlay('materials');
      const t = TOOLS.find(t => t.key === k);
      if (t) this.setTool(this.tool === t ? null : t);
    });
    window.addEventListener('resize', () => g.renderer.resize());
  }
  bindHud() {
    const g = this.game;
    for (const b of document.querySelectorAll('#speed button')) b.addEventListener('click', () => g.setSpeed(+b.dataset.speed));
    for (const b of document.querySelectorAll('#overlays button')) b.addEventListener('click', () => this.setOverlay(b.dataset.ov));
    this.$('helpBtn').addEventListener('click', () => this.showHelp());
    let lbSpeed = 0;
    this.leaderboard = GameLeaderboard({
      game: 'oxygen_colony', title: '🏆 Top 20 Colonies', format: s => s + (s === 1 ? ' cycle' : ' cycles'),
      onOpen: () => { lbSpeed = g.speed; g.setSpeed(0); },
      onClose: () => { if (lbSpeed && !g.over) g.setSpeed(lbSpeed); },
    });
    this.$('lbBtn').addEventListener('click', () => this.leaderboard.open());
  }
  setOverlay(ov) {
    this.game.renderer.overlay = ov;
    for (const b of document.querySelectorAll('#overlays button')) b.classList.toggle('on', b.dataset.ov === ov);
  }
  setSpeedButtons(s) { for (const b of document.querySelectorAll('#speed button')) b.classList.toggle('on', +b.dataset.speed === s); }

  // ------------------------------------------------------------ hover panel
  updateHover() {
    const el = this.$('hover'), g = this.game, hv = this.hover;
    if (!hv) { el.style.display = 'none'; return; }
    const c = g.world.cell(hv.x, hv.y);
    const lines = [];
    lines.push(`<b>${c.def.name}</b>${c.phase !== PH.VAC ? ' · ' + fmtMass(c.mass) : ''}`);
    if (c.phase !== PH.VAC) lines.push(`Temperature: ${K2C(c.temperature).toFixed(1)} °C`);
    if (c.phase === PH.SOL && c.maxHp > 0) lines.push(`Hardness: ${Math.ceil(c.hp)} / ${c.maxHp}`);
    if (c.element === 'oxygen') lines.push(c.mass >= 0.5 ? 'Breathable' : '<span class="w">Thin air</span>');
    const b = g.world.building(hv.x, hv.y);
    if (b) lines.push(`<b>${b.def.name}</b> — ${b.type === 'pod' ? 'Home' : b.status}`);
    if (g.world.wires[g.world.idx(hv.x, hv.y)]) {
      const n = g.power.netOf[g.world.idx(hv.x, hv.y)], s = g.power.stats[n];
      if (s) lines.push(`Wire · Grid ${n + 1}: gen ${s.gen} W, load ${s.demand} W, ${(s.stored / 1000).toFixed(1)}/${(s.cap / 1000).toFixed(0)} kJ`);
    }
    for (const t of g.tasks.tasksAt(hv.x, hv.y)) {
      const who = t.claimedBy ? ' (' + t.claimedBy.name + ')' : '';
      lines.push(`<span class="w">Order: ${t.label}${who}${t.unreachable ? ' — unreachable (try a ladder)' : ''}</span>`);
    }
    for (const d of g.dupes) if (d.fx === hv.x && (d.fy === hv.y || d.fy - 1 === hv.y)) lines.push(`<b>${d.name}</b> — ${d.stateLabel}`);
    el.innerHTML = lines.join('<br>');
    el.style.display = 'block';
  }

  // ------------------------------------------------------------ periodic refresh
  refresh() {
    const g = this.game, $ = this.$;
    $('sCycle').textContent = g.cycle;
    $('sCycleBar').style.width = ((g.time % CYCLE_LEN) / CYCLE_LEN * 100).toFixed(1) + '%';
    let o2 = 0, co2 = 0;
    for (const c of g.world.cells) { if (c.element === 'oxygen') o2 += c.mass; else if (c.element === 'co2') co2 += c.mass; }
    $('sO2').textContent = fmtMass(o2);
    $('sCO2').textContent = fmtMass(co2);
    $('sFood').textContent = Math.round(g.food).toLocaleString() + ' kcal';
    $('sFood').style.color = g.food < 1500 ? 'var(--bad)' : '';
    const alive = g.dupes.filter(d => d.alive);
    const avgS = alive.length ? alive.reduce((s, d) => s + d.stress, 0) / alive.length : 0;
    $('sStress').textContent = avgS.toFixed(0) + '%';
    $('sStress').style.color = avgS > 70 ? 'var(--bad)' : avgS > 40 ? 'var(--warn)' : '';
    const p = g.power.totals();
    $('sPower').textContent = (p.stored / 1000).toFixed(1) + '/' + (p.cap / 1000).toFixed(0) + ' kJ';
    $('sStore').textContent = Math.round(g.stock.total()) + '/' + g.storageCap() + ' kg';

    // storage rows
    const rows = [];
    for (const k in RESOURCES) rows.push(`<div class="row"><span><i style="background:${RESOURCES[k].color}"></i>${RESOURCES[k].name}</span><span>${Math.floor(g.stock.items[k])}</span></div>`);
    $('stockRows').innerHTML = rows.join('');

    this.refreshDupes();
    this.updateHover();
  }
  refreshDupes() {
    const g = this.game, bar = this.$('dupeBar');
    for (const d of g.dupes) {
      let card = this.dupeCards.get(d);
      if (!card) {
        card = document.createElement('div');
        card.className = 'dupe';
        card.innerHTML = `<div class="top"><span class="name"><i style="background:${d.palette.suit}"></i>${d.name}</span><span class="state"></span></div>
          <div class="bars">
            <div class="bar">Health<div><i class="hp" style="background:#ff5c5c"></i></div></div>
            <div class="bar">Stress<div><i class="st" style="background:#b388ff"></i></div></div>
            <div class="bar">Calories<div><i class="ca" style="background:#ffb74d"></i></div></div>
            <div class="bar">Breath<div><i class="br" style="background:#4fc3f7"></i></div></div>
          </div>`;
        card.addEventListener('click', () => { g.selected = g.selected === d ? null : d; this.refreshDupes(); });
        bar.appendChild(card);
        this.dupeCards.set(d, card);
      }
      card.classList.toggle('sel', g.selected === d);
      card.classList.toggle('dead', !d.alive);
      card.querySelector('.state').textContent = d.alive ? d.stateLabel : 'DEAD';
      card.querySelector('.hp').style.width = d.hp + '%';
      card.querySelector('.st').style.width = d.stress + '%';
      card.querySelector('.ca').style.width = (d.calories / MAX_KCAL * 100) + '%';
      card.querySelector('.br').style.width = d.breath + '%';
      card.title = `${d.name}\nHealth ${d.hp.toFixed(0)}  Stress ${d.stress.toFixed(0)}%\nCalories ${Math.round(d.calories)} kcal  Breath ${d.breath.toFixed(0)}%`;
    }
  }
  resetDupeCards() { this.$('dupeBar').innerHTML = ''; this.dupeCards.clear(); }

  // ------------------------------------------------------------ log
  appendLog(e) {
    const log = this.$('log');
    const div = document.createElement('div');
    div.className = 'e ' + (e.kind === 'info' ? '' : e.kind);
    const span = document.createElement('span'); span.textContent = 'C' + e.cycle;
    div.appendChild(span); div.appendChild(document.createTextNode(e.msg));
    log.appendChild(div);
    while (log.childNodes.length > 80) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }
  clearLog() { this.$('log').innerHTML = ''; }

  // ------------------------------------------------------------ modal
  showModal(html) { this.$('modalBox').innerHTML = html; this.$('modal').style.display = 'flex'; }
  hideModal() { this.$('modal').style.display = 'none'; }
  showHelp() {
    const g = this.game;
    const wasSpeed = g.speed;
    g.setSpeed(0);
    this.showModal(`<h2>OXYGEN COLONY</h2>
      <p>Your two Duplicants have been printed deep inside an asteroid. Keep them <b>breathing</b>, <b>fed</b> and <b>sane</b> as long as you can.</p>
      <ul>
        <li><b>Dig</b> (1): drag over rock. Dug material goes to storage (50% of the tile's mass).</li>
        <li><b>O₂ Diffuser</b> (4): burns Algae into Oxygen — your first priority. Mine the green algae deposit left of the base.</li>
        <li><b>Power</b>: a Duplicant runs the <b>Manual Generator</b>; <b>Wire</b> (0) it to a <b>Battery</b> and consumers like the <b>Electrolyzer</b> or <b>Microbe Musher</b>.</li>
        <li><b>Food</b>: rations run out after a few cycles. Dig down to the water cave and build a <b>Microbe Musher</b> next to the water (uses Dirt + Water).</li>
        <li>Use <b>Ladders</b> (3) to reach deeper areas. Duplicants can only step up one tile.</li>
        <li>CO₂ is heavy and pools in low areas. Deep rock is hot.</li>
        <li>Overlays: <kbd>O</kbd> oxygen, <kbd>T</kbd> temperature, <kbd>P</kbd> power, <kbd>V</kbd> materials.</li>
        <li><kbd>Space</kbd> pause · right-click cancels orders · <kbd>Esc</kbd> drops the tool.</li>
      </ul>
      <button class="go" id="modalGo">${g.time > 0 ? 'RESUME' : 'START COLONY'}</button>`);
    this.$('modalGo').addEventListener('click', () => { this.hideModal(); g.setSpeed(wasSpeed || 1); });
  }
  showGameOver() {
    const g = this.game;
    this.showModal(`<h2>COLONY LOST</h2>
      <p>All Duplicants have perished on cycle <b>${g.cycle}</b>.</p>
      <p>Tip: build an Oxygen Diffuser early, and secure food before the rations run out.</p>
      <button class="go" id="modalGo">NEW COLONY</button> <button class="go" id="modalLb">🏆 TOP 20</button>`);
    this.$('modalGo').addEventListener('click', () => { this.hideModal(); g.newGame(); g.setSpeed(1); });
    this.$('modalLb').addEventListener('click', () => this.leaderboard.open());
    this.leaderboard.gameOver(g.cycle);
  }
}

/* =====================================================================
 *  Game - owns world, entities and the main loop
 * ===================================================================== */
class Game {
  constructor() {
    this.canvas = document.getElementById('cv');
    this.speed = 0; this.lastSpeed = 1;
    this.newGame();
    this.renderer = new Renderer(this, this.canvas);
    this.ui = new UI(this);
    this.log.onAdd = e => this.ui.appendLog(e);
    for (const e of this.log.entries) this.ui.appendLog(e);
    this.renderer.resize();
    this.acc = 0; this.last = performance.now(); this.uiT = 0;
    this.ui.setSpeedButtons(this.speed);
    this.ui.showHelp();
    requestAnimationFrame(ts => this.frame(ts));
  }

  newGame(seed = (Math.random() * 1e9) | 0) {
    this.world = new World(COLS, ROWS);
    this.world.generate(seed);
    this.pathfinder = new Pathfinder(this.world);
    this.buildings = [];
    this.power = new PowerGrid(this);
    this.tasks = new TaskManager(this);
    this.stock = new Stockpile();
    this.food = 8000;
    this.time = 0; this.cycle = 1;
    this.over = false;
    this.selected = null;
    this.dupes = [];
    if (this.log) this.log.onAdd = null;
    this.log = new EventLog(this);
    if (this.ui) { this.ui.resetDupeCards(); this.ui.clearLog(); this.log.onAdd = e => this.ui.appendLog(e); }

    // starting base
    this.addBuilding(createBuilding(this, 'pod', 29, 20));
    this.addBuilding(createBuilding(this, 'storage', 23, 21));
    this.addBuilding(createBuilding(this, 'ration', 25, 22));
    this.addBuilding(createBuilding(this, 'generator', 34, 21));
    const bat = createBuilding(this, 'battery', 37, 21); bat.charge = 8000;
    this.addBuilding(bat);
    for (let x = 34; x <= 37; x++) this.world.wires[this.world.idx(x, 22)] = 1;
    Object.assign(this.stock.items, { sandstone: 450, copper: 160, algae: 300, dirt: 100 });

    this.spawnDupe(27, 22);
    this.spawnDupe(32, 22);
    this.log.add('Colony established. Two Duplicants were printed.', 'good');
    this.log.add('Priority: dig the algae deposit (west) and build an Oxygen Diffuser.', 'warn');
  }

  spawnDupe(x, y) {
    const k = this.dupes.length;
    const d = new Duplicant(this, DUPE_NAMES[k % DUPE_NAMES.length], x, y, DUPE_PALETTES[k % DUPE_PALETTES.length]);
    this.dupes.push(d);
    return d;
  }

  // ------------------------------------------------------------ buildings
  addBuilding(b) {
    this.buildings.push(b);
    b.forCells((x, y) => { this.world.buildings[this.world.idx(x, y)] = b; });
    this.power.dirty = true;
  }
  removeBuilding(b) {
    const i = this.buildings.indexOf(b);
    if (i < 0) return;
    this.buildings.splice(i, 1);
    b.forCells((x, y) => { const k = this.world.idx(x, y); if (this.world.buildings[k] === b) this.world.buildings[k] = null; });
    if (b.task) this.tasks.remove(b.task, false);
    for (const d of this.dupes) if (d.job && d.job.task && d.job.task.building === b) d.abortJob();
    this.power.dirty = true;
  }
  storageCap() { return this.buildings.filter(b => b.type === 'storage').length * BIN_CAP; }

  /** Placement rules shared by preview and orders. */
  /**
   * Placement rules shared by preview, orders and completion.
   * Non-strict: natural rock in the footprint is allowed (it gets dug first, like in ONI).
   */
  canPlace(type, x, y, strict = false) {
    const W = this.world, d = BUILDINGS[type];
    if (x < 1 || y < 1 || x + d.w > COLS - 1 || y + d.h > ROWS - 1) return false;
    for (let yy = y; yy < y + d.h; yy++) {
      for (let xx = x; xx < x + d.w; xx++) {
        const i = W.idx(xx, yy), c = W.cells[i];
        const natural = c.phase === PH.SOL && !c.def.constructed && !c.def.indestructible;
        if (type === 'wire') {
          if (c.phase === PH.SOL && c.element !== 'tile' && (strict || !natural)) return false;
          if (W.wires[i] || W.wirePlan[i]) return false;
          continue;
        }
        if (W.buildings[i] || W.plan[i]) return false;
        if (c.phase === PH.SOL && (strict || type === 'tile' || !natural)) return false;
      }
    }
    if (d.floor) for (let xx = x; xx < x + d.w; xx++) if (!W.isSolid(xx, y + d.h)) return false;
    return true;
  }
  /** Is a build task's footprint free of rock (so construction can start)? */
  siteClear(t) {
    const W = this.world;
    for (let y = t.y; y < t.y + t.h; y++) for (let x = t.x; x < t.x + t.w; x++) {
      const c = W.cell(x, y);
      if (c.phase === PH.SOL && !(t.buildType === 'wire' && c.element === 'tile')) return false;
    }
    return true;
  }

  // ------------------------------------------------------------ player orders
  orderDig(cells) {
    let n = 0;
    for (const [x, y] of cells) if (this.tasks.addDig(x, y)) n++;
    if (n) this.log.add(`Queued ${n} dig order${n > 1 ? 's' : ''}.`);
  }
  orderBuild(type, cells) {
    let n = 0;
    const d = BUILDINGS[type];
    for (const [x, y] of cells) {
      const t = this.tasks.addBuild(type, x, y);
      if (!t) continue;
      n++;
      // natural rock in the footprint is queued for digging automatically
      for (let yy = y; yy < y + d.h; yy++) for (let xx = x; xx < x + d.w; xx++) {
        const c = this.world.cell(xx, yy);
        if (c.phase === PH.SOL && !(type === 'wire' && c.element === 'tile')) this.tasks.addDig(xx, yy);
      }
    }
    if (!n) return;
    if (type !== 'wire' && type !== 'tile' && type !== 'ladder') this.log.add(`Planned ${withArticle(d.name)}.`);
    else this.log.add(`Planned ${n} × ${d.name}.`);
    if (!this.stock.canAfford(d.cost)) this.log.add(`Not enough materials for ${d.name} (${fmtCost(d.cost)}).`, 'warn', 'mat' + type, 10);
  }
  orderDecon(cells) {
    const W = this.world;
    let n = 0;
    for (const [x, y] of cells) {
      const i = W.idx(x, y);
      if (W.wires[i]) { W.wires[i] = 0; this.stock.refund({ copper: 5 }); this.power.dirty = true; n++; }
      const b = W.buildings[i];
      if (b && this.tasks.addDecon(b)) n++;
      if (W.cells[i].element === 'tile' && this.tasks.addDig(x, y)) n++;
    }
    if (n) this.log.add(`Queued ${n} deconstruction order${n > 1 ? 's' : ''}.`);
  }
  cancelAt(cells) {
    const set = new Set();
    for (const [x, y] of cells) for (const t of this.tasks.tasksAt(x, y)) if (t.kind !== 'operate') set.add(t);
    for (const t of set) this.tasks.remove(t, true);
    if (set.size) this.log.add(`Cancelled ${set.size} order${set.size > 1 ? 's' : ''}.`);
  }
  selectAt(x, y) {
    this.selected = this.dupes.find(d => Math.abs(d.x - x) <= 0.7 && y >= Math.round(d.y) - 1 && y <= Math.round(d.y)) || null;
    this.ui.refreshDupes();
  }

  // ------------------------------------------------------------ task completion
  completeDig(t) {
    const W = this.world, c = W.cell(t.x, t.y);
    const res = c.def.res, amount = c.mass * 0.5;
    this.tasks.remove(t, false);
    t.done = true;
    if (res) {
      const stored = this.stock.add(res, amount, this.storageCap());
      if (stored < amount - 0.01) this.log.add('Storage is full! Mined material was lost. Build more Storage Bins.', 'warn', 'storefull', 30);
    }
    c.clear();
    if (res === 'algae') this.log.add('Algae mined and stored.', 'good', 'algaemined', 60);
  }
  completeBuild(t, dupe) {
    const W = this.world, type = t.buildType, d = BUILDINGS[type];
    this.tasks.remove(t, false);
    t.done = true;
    if (!this.canPlace(type, t.x, t.y, true)) {
      this.stock.refund(t.payment);
      this.log.add(`Construction of ${d.name} failed: site obstructed.`, 'warn');
      return;
    }
    if (type === 'tile') {
      W.displace(t.x, t.y);
      const c = W.cell(t.x, t.y);
      c.set('tile', 50, c.temperature || 295);
      for (const dp of this.dupes) if (dp.alive && dp.fx === t.x && (dp.fy === t.y || dp.fy - 1 === t.y)) dp.unstick();
    } else if (type === 'wire') {
      W.wires[W.idx(t.x, t.y)] = 1;
      this.power.dirty = true;
    } else {
      const b = createBuilding(this, type, t.x, t.y);
      b.payment = t.payment;
      this.addBuilding(b);
      if (type !== 'ladder') this.log.add(`${dupe.name} finished building ${withArticle(d.name)}.`, 'good');
    }
  }
  completeDecon(t) {
    const b = t.building;
    this.tasks.remove(t, false);
    t.done = true;
    this.stock.refund(b.payment);
    this.removeBuilding(b);
    this.log.add(`${b.def.name} deconstructed.`);
  }

  // ------------------------------------------------------------ loop
  setSpeed(s) {
    if (s > 0) this.lastSpeed = s;
    this.speed = s;
    if (this.ui) this.ui.setSpeedButtons(s);
  }

  step(dt) {
    this.time += dt;
    const W = this.world;
    W.updateLiquids();
    W.updateGases();
    W.updateHeat(dt);
    for (const b of this.buildings) b.preUpdate(dt);
    this.power.update(dt);
    for (const b of this.buildings) b.update(dt);
    for (const d of this.dupes) d.update(dt);

    // cycle rollover, printing pod
    const cyc = Math.floor(this.time / CYCLE_LEN) + 1;
    if (cyc !== this.cycle) {
      this.cycle = cyc;
      this.log.add(`— Cycle ${cyc} begins —`, 'good');
      const alive = this.dupes.filter(d => d.alive).length;
      if (cyc % 3 === 1 && alive > 0 && alive < MAX_DUPES && this.food >= 2000) {
        const pod = this.buildings.find(b => b.type === 'pod');
        if (pod) {
          const nd = this.spawnDupe(pod.x + 1, pod.y + pod.h - 1);
          this.log.add(`The Printing Pod printed a new Duplicant: ${nd.name}!`, 'good');
        }
      }
    }
    if ((this.world.tick % 20) === 0) this.tasks.updateReachability();
    // colony-wide alerts
    if (this.food < 1500) this.log.add('Food is running low! Build a Microbe Musher.', 'warn', 'lowfood', 150);
    if (this.stock.items.algae < 1 && this.buildings.some(b => b.type === 'diffuser'))
      this.log.add('Out of Algae! Oxygen Diffusers have stopped.', 'warn', 'noalgae', 60);
    if (!this.over && this.dupes.length && this.dupes.every(d => !d.alive)) {
      this.over = true;
      this.ui.showGameOver();
    }
  }

  frame(ts) {
    const dt = Math.min(0.25, Math.max(0, (ts - this.last) / 1000));
    this.last = ts;
    if (!this.over && this.speed > 0) {
      this.acc += dt * this.speed;
      let n = 0;
      while (this.acc >= SIM_DT && n < 12) { this.step(SIM_DT); this.acc -= SIM_DT; n++; }
      if (n >= 12) this.acc = 0;
    }
    try { this.renderer.draw(this.speed > 0 ? dt : 0); }
    catch (err) { console.error(err); }
    this.uiT -= dt;
    if (this.uiT <= 0) { this.uiT = 0.25; this.ui.refresh(); }
    requestAnimationFrame(t => this.frame(t));
  }
}

window.game = new Game();
</script>
</body>
</html>
