    function updateGame() {
      if (gameState === 'playing') {
        Player.update();
        Camera.update();
        
        // 更新二段跳UI
        updateDoubleJumpUI();
        
        // 计分
        const playerHeight = -Player.y;
        if (playerHeight > score) {
          score = Math.floor(playerHeight);
        }
        
        // 作弊码：Control+P 召唤蓝色喷气背包，带玩家上升5000分
        if (Input.cheat && !Player.jetpackActive && !Player.rocketActive && !Player.helicopterActive) {
          Player.jetpack = new Jetpack(Player.x + Player.width + 15, Player.y + Player.height / 2);
          Player.jetpack.activate();
          Player.jetpackActive = true;
          Player.vy = 0; // 从速度0开始
          Player.squash = 0.3;
          Player.stretch = 2.0;
          playRocketSound(); // 使用火箭音效
          
          ParticleSystem.emit(
            Player.x + Player.width / 2,
            Player.y + Player.height,
            CONFIG.PARTICLE_COUNT * 3,
            '#4169e1'
          );
          
          Input.cheat = false;
        }
        
        PlatformManager.update(score);
        CannonManager.update(score, Player);
        ParticleSystem.update();
        
        // Game Over 检测
        if (Player.y - Camera.y > CONFIG.CANVAS_HEIGHT) {
          playFallSound();
          Camera.addShake(20);
          handleGameOver(); // 调用统一的游戏结束处理
        }
      } else if (gameState === 'gameover') {
        gameOverTimer--;
        Camera.shake *= 0.95;
        
        if (Input.restart) {
          initGame();
          Input.restart = false;
        }
      } else if (gameState === 'ready') {
        if (Input.left || Input.right) {
          gameState = 'playing';
        }
      }
    }
    
    function drawGame(ctx) {
      const shake = Camera.getShakeOffset();
      
      ctx.save();
      ctx.translate(shake.x, shake.y);
      
      Renderer.drawBackground(ctx, Camera.y);
      PlatformManager.draw(ctx, Camera.y);
      CannonManager.draw(ctx, Camera.y);
      Player.draw(ctx, Camera.y);
      ParticleSystem.draw(ctx, Camera.y);
      
      ctx.restore();
      
      Renderer.drawUI(ctx, score, gameState);
    }
    
    // ========================================
    // 主循环
    // ========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const camera = Camera;
    
    canvas.width = CONFIG.CANVAS_WIDTH;
    canvas.height = CONFIG.CANVAS_HEIGHT;
    
    Input.init();
    
    // Setup name input event listeners
    document.addEventListener('DOMContentLoaded', () => {
      const inputEl = document.getElementById('playerNameInput');
      const submitBtn = document.getElementById('submitScoreBtn');
      
      if (inputEl) {
        inputEl.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            submitScore();
          }
        });
      }
      
      if (submitBtn) {
        submitBtn.addEventListener('click', submitScore);
      }
    });
    
    loadGlobalHighScore();
    initGame();
    
    let lastTime = 0;
    const FIXED_TIME_STEP = 1000 / 60; // 60 FPS
    let accumulator = 0;
    
    function gameLoop(timestamp) {
      if (lastTime === 0) {
        lastTime = timestamp;
      }
      
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;
      
      // Cap deltaTime to prevent spiral of death
      const cappedDelta = Math.min(deltaTime, 100);
      accumulator += cappedDelta;
      
      // Update game at fixed timestep
      while (accumulator >= FIXED_TIME_STEP) {
        updateGame();
        accumulator -= FIXED_TIME_STEP;
      }
      
      drawGame(ctx);
      
      requestAnimationFrame(gameLoop);
    }
    
    async function loadAnnouncement() {
      try {
        const response = await fetch(SCORE_API + '?action=announcement');
        const result = await response.json();
        const announcementBox = document.getElementById('announcement');
        const announcementContent = document.getElementById('announcementContent');
        
        if (result.announcement && result.announcement.trim()) {
          announcementContent.textContent = result.announcement;
          announcementBox.style.display = 'block';
        } else {
          announcementBox.style.display = 'none';
        }
      } catch (error) {
        console.log('Could not load announcement', error);
      }
    }
    
    function updateDoubleJumpUI() {
      const barFill = document.getElementById('doubleJumpBar');
      const barText = document.getElementById('doubleJumpText');
      
      if (Player.doubleJumpAvailable) {
        barFill.style.width = '100%';
        barFill.classList.remove('cooling');
        barText.textContent = 'READY';
      } else {
        const cooldownPercent = 1 - (Player.doubleJumpCooldown / Player.doubleJumpCooldownMax);
        barFill.style.width = (cooldownPercent * 100) + '%';
        barFill.classList.add('cooling');
        const secondsLeft = Math.ceil(Player.doubleJumpCooldown / 60);
        barText.textContent = `${secondsLeft}s`;
      }
    }

    async function updateAnnouncement() {
      const text = document.getElementById('announcementText').value;
      try {
        const response = await fetch(SCORE_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `action=update_announcement&announcement=${encodeURIComponent(text)}&passwordHash=${ADMIN_PASSWORD_HASH}`
        });
        const result = await response.json();
        if (result.success) {
          alert('Announcement updated!');
          await loadAnnouncement();
        } else {
          alert('Failed to update: ' + (result.error || 'Unknown error'));
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    async function clearAnnouncement() {
      document.getElementById('announcementText').value = '';
      await updateAnnouncement();
    }

    async function loadAnnouncementText() {
      try {
        const response = await fetch(SCORE_API + '?action=announcement');
        const result = await response.json();
        document.getElementById('announcementText').value = result.announcement || '';
      } catch (error) {
        console.log('Could not load announcement text', error);
      }
    }
    
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
