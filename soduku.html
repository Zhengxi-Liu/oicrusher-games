<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Game</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 450px; /* Adjust as needed */
            height: 450px; /* Adjust as needed */
            border: 2px solid black;
        }

        .cell {
            width: 50px;
            height: 50px;
            border: 1px solid lightgray;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .cell.given {
            background-color: #eee;
            color: black;
            font-weight: bold;
        }

        .cell input {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 20px;
            border: none;
            outline: none;
        }

        /* Add thicker borders for 3x3 blocks */
        .sudoku-grid > div:nth-child(3n) {
            border-right: 2px solid black;
        }

        .sudoku-grid > div:nth-child(27n + 1) ~ div:nth-child(27n + 9) {
            border-bottom: 2px solid black;
        }

        .sudoku-grid > div:nth-child(1) ~ div:nth-child(9) {
            border-top: 2px solid black;
        }

        .sudoku-grid > div:nth-child(1),
        .sudoku-grid > div:nth-child(10),
        .sudoku-grid > div:nth-child(19),
        .sudoku-grid > div:nth-child(28),
        .sudoku-grid > div:nth-child(37),
        .sudoku-grid > div:nth-child(46),
        .sudoku-grid > div:nth-child(55),
        .sudoku-grid > div:nth-child(64),
        .sudoku-grid > div:nth-child(73) {
            border-left: 2px solid black;
        }

        #message {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: green;
        }

        .hidden {
            display: none;
        }
    </style>
  <script src="identity.js?v=2"></script>
</head>
<body>
    <h1>Sudoku Game</h1>

    <div class="controls">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>
        <button id="new-game-btn">New Game</button>
        <button id="restart-btn">Restart</button>
    </div>

    <div class="sudoku-grid">
    </div>

    <div id="message" class="hidden"></div>

    <script>
        const gridContainer = document.querySelector('.sudoku-grid');
        const difficultySelect = document.getElementById('difficulty');
        const newGameBtn = document.getElementById('new-game-btn');
        const restartBtn = document.getElementById('restart-btn');
        const messageDiv = document.getElementById('message');

        let currentGrid = [];
        let solutionGrid = [];
        const gridSize = 9;

        function generateSudoku(difficulty) {
            const solvedGrid = generateSolvedSudoku();
            solutionGrid = solvedGrid.map(row => [...row]);

            const emptyCells = getNumberOfEmptyCells(difficulty);
            const puzzleGrid = solvedGrid.map(row => [...row]);

            let removedCount = 0;
            while (removedCount < emptyCells) {
                const row = Math.floor(Math.random() * gridSize);
                const col = Math.floor(Math.random() * gridSize);
                if (puzzleGrid[row][col] !== 0) {
                    puzzleGrid[row][col] = 0;
                    removedCount++;
                }
            }
            return puzzleGrid;
        }

        function generateSolvedSudoku() {
            const grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(0));

            function isValidPlacement(grid, row, col, num) {
                for (let i = 0; i < gridSize; i++) {
                    if (grid[row][i] === num) return false;
                }
                for (let i = 0; i < gridSize; i++) {
                    if (grid[i][col] === num) return false;
                }
                const startRow = Math.floor(row / 3) * 3;
                const startCol = Math.floor(col / 3) * 3;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (grid[startRow + i][startCol + j] === num) return false;
                    }
                }
                return true;
            }

            function solve(grid) {
                for (let row = 0; row < gridSize; row++) {
                    for (let col = 0; col < gridSize; col++) {
                        if (grid[row][col] === 0) {
                            for (let num = 1; num <= 9; num++) {
                                if (isValidPlacement(grid, row, col, num)) {
                                    grid[row][col] = num;
                                    if (solve(grid)) {
                                        return true;
                                    }
                                    grid[row][col] = 0;
                                }
                            }
                            return false;
                        }
                    }
                }
                return true;
            }

            solve(grid);
            return grid;
        }

        function getNumberOfEmptyCells(difficulty) {
            switch (difficulty) {
                case 'easy':
                    return 40;
                case 'medium':
                    return 50;
                case 'hard':
                    return 60;
                default:
                    return 40;
            }
        }

        function createGrid(grid) {
            gridContainer.innerHTML = '';
            grid.forEach((row, rowIndex) => {
                row.forEach((value, colIndex) => {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (value !== 0) {
                        cell.classList.add('given');
                        cell.textContent = value;
                    } else {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.min = '1';
                        input.max = '9';
                        input.addEventListener('input', () => {
                            if (input.value.length > 1) {
                                input.value = input.value.slice(0, 1);
                            }
                            if (input.value && !isNaN(parseInt(input.value))) {
                                currentGrid[rowIndex][colIndex] = parseInt(input.value);
                            } else {
                                currentGrid[rowIndex][colIndex] = 0;
                            }
                        });
                        cell.appendChild(input);
                    }
                    gridContainer.appendChild(cell);
                });
            });
        }

        function startNewGame() {
            const difficulty = difficultySelect.value;
            const newSudoku = generateSudoku(difficulty);
            currentGrid = newSudoku.map(row => [...row]);
            createGrid(currentGrid);
            messageDiv.classList.add('hidden');
        }

        function restartGame() {
            createGrid(currentGrid);
            messageDiv.classList.add('hidden');
        }

        function checkWin() {
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    if (currentGrid[i][j] === 0 || currentGrid[i][j] !== solutionGrid[i][j]) {
                        return false;
                    }
                }
            }
            messageDiv.textContent = 'Congratulations! You solved the Sudoku!';
            messageDiv.classList.remove('hidden');
            return true;
        }

        gridContainer.addEventListener('input', (event) => {
            if (event.target.tagName === 'INPUT') {
                checkWin();
            }
        });

        newGameBtn.addEventListener('click', startNewGame);
        restartBtn.addEventListener('click', restartGame);

        startNewGame();
    </script>
</body>
</html>
